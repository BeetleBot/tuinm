[package]
name = "tuinm"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
zbus = "4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
